version: "2.0.0"
project:
  name: "liquid-harness"
  description: "Ephemeral 100% Rust micro-kernel agent infrastructure with regularized self-improvement"
  root: "."
  runtime: "rust"

microkernel:
  architecture: "single-binary-monolith"
  engine: "liquid-core"
  binary: "bin/liquid"
  zero_copy_ipc: true

tracks:
  - id: "prompt_optimization"
    name: "Prompt Footprint Optimization"
    target_component: "prompt"
    benchmark_adapter: "agent_eval"
    generator: "failure_summary"
    policy:
      screening_min_score: 1.0
      validation_min_win: 0.05
      min_stability_threshold: 0.85
      confidence_level: 0.95

  - id: "tool_synthesis"
    name: "Dynamic Tool Evolution"
    target_component: "tool"
    benchmark_adapter: "cargo_test"
    generator: "template"
    policy:
      screening_min_score: 1.0
      validation_min_win: 0.02
      min_stability_threshold: 0.80
      confidence_level: 0.95

  - id: "security_hardening"
    name: "Zero-Trust Security Barrier"
    target_component: "guardrail"
    benchmark_adapter: "generic_command"
    generator: "template"
    policy:
      screening_min_score: 1.0
      validation_min_win: 0.0
      min_stability_threshold: 0.90
      confidence_level: 0.95
