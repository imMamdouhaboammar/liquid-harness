syntax = "proto3";

package liquid.v1;

option go_package = "github.com/liquid-harness/liquid-harness/orchestrator/gen/liquid/v1;liquidv1";

enum ComponentKind {
  COMPONENT_KIND_UNSPECIFIED = 0;
  COMPONENT_KIND_SYSTEM_PROMPT = 1;
  COMPONENT_KIND_GUARDRAIL = 2;
  COMPONENT_KIND_TOOL_REGISTRY = 3;
  COMPONENT_KIND_MEMORY_TOPOLOGY = 4;
  COMPONENT_KIND_SKILL_CATALOG = 5;
  COMPONENT_KIND_SUBAGENT_ROUTER = 6;
  COMPONENT_KIND_CRITIC_POLICY = 7;
  COMPONENT_KIND_MODEL_DISPATCH = 8;
}

enum ProposalStatus {
  PROPOSAL_STATUS_UNSPECIFIED = 0;
  PROPOSAL_STATUS_PROPOSED = 1;
  PROPOSAL_STATUS_PROBING = 2;
  PROPOSAL_STATUS_PRUNED = 3;
  PROPOSAL_STATUS_ACCEPTED = 4;
  PROPOSAL_STATUS_REJECTED = 5;
}

message HarnessComponent {
  string id = 1;
  ComponentKind kind = 2;
  string name = 3;
  string content = 4;
  string checksum = 5;
  uint64 version = 6;
  map<string, string> metadata = 7;
}

message TaskSpec {
  string task_id = 1;
  string prompt = 2;
  repeated string required_capabilities = 3;
  int64 max_tokens = 4;
  int64 max_wall_time_ms = 5;
  map<string, string> context = 6;
}

message MutationProposal {
  string proposal_id = 1;
  string task_id = 2;
  ComponentKind target_component = 3;
  string rationale = 4;
  string diff = 5;
  int64 estimated_token_overhead = 6;
  ProposalStatus status = 7;
}

message ProbeTrace {
  string probe_id = 1;
  string proposal_id = 2;
  bool execution_success = 3;
  double divergence_score = 4;
  int64 tokens_consumed = 5;
  int64 latency_ms = 6;
  repeated string failure_signatures = 7;
}

message RegularizationVerdict {
  string proposal_id = 1;
  bool passed = 2;
  double ood_generalization_score = 3;
  double token_efficiency_ratio = 4;
  string critic_notes = 5;
  repeated string pruning_reasons = 6;
}

message ExperienceLedgerEntry {
  string entry_id = 1;
  string task_signature = 2;
  repeated MutationProposal accepted_mutations = 3;
  RegularizationVerdict validation = 4;
  int64 timestamp_unix_sec = 5;
}
