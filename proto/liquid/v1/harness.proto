syntax = "proto3";

package liquid.v1;

option go_package = "github.com/liquid-harness/liquid-harness/orchestrator/gen/liquid/v1;liquidv1";

enum ComponentKind {
  COMPONENT_KIND_UNSPECIFIED = 0;
  COMPONENT_KIND_SYSTEM_PROMPT = 1;
  COMPONENT_KIND_GUARDRAIL = 2;
  COMPONENT_KIND_TOOL_REGISTRY = 3;
  COMPONENT_KIND_MEMORY_TOPOLOGY = 4;
  COMPONENT_KIND_SKILL_CATALOG = 5;
  COMPONENT_KIND_SUBAGENT_ROUTER = 6;
  COMPONENT_KIND_CRITIC_POLICY = 7;
  COMPONENT_KIND_PLUGIN = 8;
}

enum AuditVerdict {
  AUDIT_VERDICT_UNSPECIFIED = 0;
  AUDIT_VERDICT_PASSED = 1;
  AUDIT_VERDICT_REJECTED = 2;
  AUDIT_VERDICT_REQUIRES_SANITIZATION = 3;
}

enum LifecyclePhase {
  LIFECYCLE_PHASE_UNSPECIFIED = 0;
  LIFECYCLE_PHASE_BOOT = 1;
  LIFECYCLE_PHASE_SELF_ASSEMBLING = 2;
  LIFECYCLE_PHASE_ACTIVE = 3;
  LIFECYCLE_PHASE_SCOUT_24H = 4;
  LIFECYCLE_PHASE_REGULARIZED_AUDIT = 5;
  LIFECYCLE_PHASE_HOTSWAP_ROLLOUT = 6;
}

message ToolDefinition {
  string id = 1;
  string name = 2;
  string description = 3;
  string version = 4;
  string schema_json = 5;
  string execution_handler = 6;
  repeated string tags = 7;
  int64 estimated_tokens = 8;
  string source_uri = 9;
}

message HarnessComponent {
  string id = 1;
  ComponentKind kind = 2;
  string name = 3;
  string content = 4;
  string checksum = 5;
  uint64 version = 6;
  map<string, string> metadata = 7;
}

message AuditRequest {
  string proposal_id = 1;
  ComponentKind component_kind = 2;
  string proposed_content = 3;
  string schema_json = 4;
}

message AuditResponse {
  string proposal_id = 1;
  AuditVerdict verdict = 2;
  repeated string violations = 3;
  string sanitized_content = 4;
  int64 latency_us = 5;
}

message DiscoverRequest {
  string agent_id = 1;
  string task_intent = 2;
  repeated string requested_tags = 3;
  int32 max_results = 4;
}

message DiscoverResponse {
  repeated ToolDefinition tools = 1;
  int32 total_discovered = 2;
}

message ScoutRequest {
  string agent_id = 1;
  int64 scout_interval_sec = 2;
  repeated string active_tool_ids = 3;
}

message ScoutResponse {
  int32 updates_detected = 1;
  repeated ToolDefinition candidate_tools = 2;
}

message ProbeRequest {
  string probe_id = 1;
  string tool_id = 2;
  string input_payload = 3;
  int64 timeout_ms = 4;
}

message ProbeResponse {
  string probe_id = 1;
  bool success = 2;
  string output_payload = 3;
  int64 execution_time_us = 4;
  string error_message = 5;
}

message ContrastiveEvaluationRequest {
  string evaluation_id = 1;
  ToolDefinition baseline_tool = 2;
  ToolDefinition candidate_tool = 3;
  repeated string sample_inputs = 4;
}

message ContrastiveEvaluationResponse {
  string evaluation_id = 1;
  bool candidate_superior = 2;
  double baseline_success_rate = 3;
  double candidate_success_rate = 4;
  int64 baseline_avg_latency_us = 5;
  int64 candidate_avg_latency_us = 6;
  double divergence_score = 7;
  string notes = 8;
}

message OptimizePromptRequest {
  string agent_id = 1;
  string current_prompt = 2;
  repeated ToolDefinition active_tools = 3;
  int64 max_target_tokens = 4;
}

message OptimizePromptResponse {
  string optimized_prompt = 1;
  int64 original_tokens = 2;
  int64 optimized_tokens = 3;
  double compression_ratio = 4;
}

message TokenBudgetEvaluationRequest {
  int64 baseline_tokens = 1;
  int64 proposed_tokens = 2;
  int64 max_allowed_budget = 3;
}

message TokenBudgetEvaluationResponse {
  bool budget_passed = 1;
  int64 token_delta = 2;
  string reason = 3;
}

message AgentState {
  string agent_id = 1;
  LifecyclePhase phase = 2;
  uint64 generation = 3;
  repeated HarnessComponent components = 4;
  repeated ToolDefinition active_tools = 5;
  int64 uptime_seconds = 6;
  int32 restart_count = 7;
}

// 1. Rust Security Critic Service
service SecurityCriticService {
  rpc AuditProposal(AuditRequest) returns (AuditResponse);
}

// 2. Go Tool Registry & Router Service
service ToolRegistryService {
  rpc DiscoverCapabilities(DiscoverRequest) returns (DiscoverResponse);
  rpc ScoutUpdates(ScoutRequest) returns (ScoutResponse);
}

// 3. Bun Ephemeral Execution Sandbox Service
service ProbeSandboxService {
  rpc RunProbe(ProbeRequest) returns (ProbeResponse);
  rpc RunContrastiveEvaluation(ContrastiveEvaluationRequest) returns (ContrastiveEvaluationResponse);
}

// 4. Python Inference Gateway & Prompt Optimizer Service
service InferenceOptimizerService {
  rpc OptimizePrompt(OptimizePromptRequest) returns (OptimizePromptResponse);
  rpc EvaluateTokenBudget(TokenBudgetEvaluationRequest) returns (TokenBudgetEvaluationResponse);
}
