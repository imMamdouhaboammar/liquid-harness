[workspace]
resolver = "2"
members = [
    "crates/liquid-core",
    "crates/liquid-probe",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Liquid Harness Team"]
license = "Apache-2.0"
repository = "https://github.com/liquid-harness/liquid-harness"

[workspace.dependencies]
tokio = { version = "1.43", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.11"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tonic = "0.12"
prost = "0.13"
tonic-build = "0.12"
