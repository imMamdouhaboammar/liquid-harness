name: Liquid Harness CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Polyglot Quality Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: '27.x'
          elixir-version: '1.17.x'

      - name: Install Protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Install Dependencies
        run: |
          cd runtime && bun install
          cd ../supervision && mix local.hex --force && mix local.rebar --force && mix deps.get
          cd ../research && uv sync

      - name: Run Static Checks & Linting
        run: make check

      - name: Run Test Suites
        run: make test

      - name: Run 5-Phase Mutation Simulation
        run: make simulate
