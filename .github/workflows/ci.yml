name: Liquid Harness CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: 100% Rust Quality Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Static Checks & Compilation
        run: make check

      - name: Unit & Integration Tests
        run: make test

      - name: Build Release Binary
        run: make build

      - name: Run 5-Phase Mutation Simulation
        run: make simulate
