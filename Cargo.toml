[workspace]
resolver = "2"
members = [
    "crates/liquid-core",
    "crates/liquid-cli",
]

[workspace.package]
version = "2.0.0"
edition = "2021"
authors = ["Mamdouh Aboammar <mamdouhfces1997@gmail.com>"]
license = "Apache-2.0"
repository = "https://github.com/imMamdouhaboammar/liquid-harness"

[workspace.dependencies]
tokio = { version = "1.43", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.11"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.5", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
